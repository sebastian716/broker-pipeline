<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pipeline Broker — Créditos Despierta</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cd-dark: #002F87;
  --cd-blue: #00A0DF;
  --cd-light: #E8F4FC;
  --cd-green: #76bc21;
  --cd-red: #D93025;
  --cd-amber: #F59E0B;
  --r: 12px; --rs: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Barlow', sans-serif; background: #F0F4FA; min-height: 100vh; color: #1a2840; }
.app { max-width: 420px; margin: 0 auto; padding-bottom: 32px; }
.header { background: var(--cd-dark); padding: 14px 20px 12px; display: flex; align-items: center; gap: 14px; }
.header img { height: 38px; display: block; }
.header-sub { font-size: 11px; color: var(--cd-blue); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
.sec { padding: 14px 16px 0; }
.sec-title { font-family: 'Josefin Sans'; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6B7FA8; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: white; border-radius: var(--rs); padding: 12px 14px; border: 1px solid #E2EAF4; }
.stat .lbl { font-size: 11px; color: #6B7FA8; margin-bottom: 3px; font-weight: 500; }
.stat .val { font-family: 'Josefin Sans'; font-size: 22px; font-weight: 700; color: var(--cd-dark); line-height:1; }
.stat .val.g { color: var(--cd-green); }
.stat .val.b { color: var(--cd-blue); }
.stat .val.r { color: var(--cd-red); }
.stat .val.sm { font-size: 15px; padding-top:4px; }
.stat .sub { font-size: 11px; color: #9AAAC0; margin-top: 3px; }
.banner { background: var(--cd-dark); border-radius: var(--r); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.bi { text-align: center; }
.bi .bl { font-size: 10px; color: #B3DDF2; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
.bi .bv { font-family: 'Josefin Sans'; font-size: 18px; font-weight: 700; color: white; }
.bi .bv.earned { color: #7EE8A2; }
.bdiv { width: 1px; height: 36px; background: rgba(255,255,255,.2); }
.card { background: white; border-radius: var(--r); padding: 14px; border: 1px solid #E2EAF4; cursor: pointer; border-left: 4px solid #E2EAF4; margin-bottom: 8px; }
.card.urgent { border-left-color: var(--cd-red); }
.card.today { border-left-color: var(--cd-amber); }
.card.ok { border-left-color: var(--cd-green); }
.card.closed { border-left-color: #CBD5E1; opacity: .6; }
.ct { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.cn { font-family: 'Josefin Sans'; font-size: 15px; font-weight: 600; color: var(--cd-dark); }
.pill { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.p1{background:#EBF4FF;color:#1E5FA8} .p2{background:#F0EBFF;color:#5B21B6} .p3{background:#FFF7EB;color:#92400E}
.p4{background:#ECFDF5;color:#065F46} .p5{background:#EFF6FF;color:#1D4ED8} .p6{background:#FEF2F2;color:#991B1B}
.cm { display: flex; gap: 14px; font-size: 12px; color: #6B7FA8; flex-wrap: wrap; }
.cc { margin-top: 8px; padding-top: 8px; border-top: 1px solid #F1F5FB; display: flex; justify-content: space-between; font-size: 12px; color: #6B7FA8; }
.cca { font-family: 'Josefin Sans'; font-weight: 700; font-size: 14px; color: var(--cd-dark); }
.cca.eb { color: white; background: var(--cd-green); padding: 2px 8px; border-radius: 20px; font-size: 12px; }
.ut { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; margin-top: 6px; }
.ut.urgent{color:var(--cd-red)} .ut.today{color:var(--cd-amber)} .ut.ok{color:var(--cd-green)}
.add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-top: 2px; border: 1.5px dashed #B3DDF2; border-radius: var(--r); background: transparent; color: var(--cd-blue); font-family: 'Barlow'; font-size: 14px; font-weight: 500; cursor: pointer; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,20,60,.55); z-index: 100; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; padding: 20px 20px 32px; }
.handle { width: 40px; height: 4px; background: #D1D9E6; border-radius: 2px; margin: 0 auto 18px; }
.modal h2 { font-family: 'Josefin Sans'; font-size: 18px; font-weight: 700; color: var(--cd-dark); margin-bottom: 16px; }
.fg { margin-bottom: 13px; }
.fg label { display: block; font-size: 11px; font-weight: 600; color: #4B5C7A; margin-bottom: 4px; letter-spacing: .3px; text-transform: uppercase; }
.fg input,.fg select,.fg textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #D1DCF0; border-radius: var(--rs); font-family: 'Barlow'; font-size: 14px; color: var(--cd-dark); background: white; }
.fg textarea { resize: none; height: 68px; }
.fg input:focus,.fg select:focus,.fg textarea:focus { outline: none; border-color: var(--cd-blue); }
.crow { display: flex; gap: 10px; align-items: flex-end; }
.cprev { font-family: 'Josefin Sans'; font-weight: 700; font-size: 18px; color: var(--cd-dark); background: var(--cd-light); padding: 10px 14px; border-radius: var(--rs); text-align: center; min-width: 120px; }
.mbtns { display: flex; gap: 10px; margin-top: 18px; }
.btnp { flex: 1; padding: 13px; background: var(--cd-dark); color: white; border: none; border-radius: var(--rs); font-family: 'Josefin Sans'; font-size: 14px; font-weight: 700; cursor: pointer; }
.btnc { padding: 13px 18px; background: white; color: #6B7FA8; border: 1.5px solid #D1DCF0; border-radius: var(--rs); font-family: 'Barlow'; font-size: 14px; cursor: pointer; }
.dh { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.dn { font-family: 'Josefin Sans'; font-size: 20px; font-weight: 700; color: var(--cd-dark); }
.xbtn { background: #F0F4FA; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; color: #6B7FA8; display: flex; align-items: center; justify-content: center; }
.dr { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F1F5FB; font-size: 13px; }
.dr .dl { color: #6B7FA8; } .dr .dv { font-weight: 500; color: var(--cd-dark); text-align: right; max-width: 55%; }
.dr .dv.bl { color: var(--cd-blue); } .dr .dv.gn { color: var(--cd-green); font-weight: 700; }
.ssub { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #6B7FA8; margin: 14px 0 8px; }
.sopt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--rs); border: 1.5px solid #E2EAF4; background: white; cursor: pointer; font-size: 13px; font-family: 'Barlow'; color: var(--cd-dark); text-align: left; margin-bottom: 6px; width: 100%; }
.sopt.active { border-color: var(--cd-dark); background: #EBF4FF; font-weight: 600; }
.sdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.delbtn { width: 100%; padding: 12px; margin-top: 10px; background: white; border: 1.5px solid #FECDD3; border-radius: var(--rs); color: var(--cd-red); font-family: 'Barlow'; font-size: 13px; cursor: pointer; }
.empty { text-align: center; padding: 32px 16px; color: #9AAAC0; font-size: 14px; }
.closed-lbl { font-family: 'Josefin Sans'; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #9AAAC0; margin: 14px 0 8px; }
</style>
</head>

<script>
const ST=[
  {id:1,label:"Primer contacto",color:"#3B82F6",cls:"p1"},
  {id:2,label:"Docs en revisión",color:"#8B5CF6",cls:"p2"},
  {id:3,label:"En evaluación CD",color:"#F59E0B",cls:"p3"},
  {id:4,label:"Aprobado",color:"#10B981",cls:"p4"},
  {id:5,label:"Desembolsado",color:"#00A0DF",cls:"p5"},
  {id:6,label:"Caído / Perdido",color:"#EF4444",cls:"p6"},
];
function lc(){try{const s=localStorage.getItem("cdbrv3");if(s)return JSON.parse(s);}catch(e){}
const t=new Date().toISOString().slice(0,10);
const p2=(d=>{d.setDate(d.getDate()-2);return d.toISOString().slice(0,10);})(new Date());
const f3=(d=>{d.setDate(d.getDate()+3);return d.toISOString().slice(0,10);})(new Date());
return[
  {id:1,name:"Carlos Mendoza",phone:"987654321",amount:150000,commPct:1,stage:3,followUp:t,notes:"Local en Miraflores. Espera tasación."},
  {id:2,name:"Lucía Torres",phone:"912345678",amount:80000,commPct:1,stage:2,followUp:p2,notes:"Falta copia DNI y partida registral."},
  {id:3,name:"Roberto Vega",phone:"956789012",amount:220000,commPct:1.5,stage:5,followUp:f3,notes:"Desembolsado. Cobrar comisión."},
];}
function sc(c){try{localStorage.setItem("cdbrv3",JSON.stringify(c));}catch(e){}}
let clients=lc(),selId=null;
function ca(a,p){return Math.round(a*(p||1)/100);}
function fmt(n){if(!n)return"—";return"S/ "+parseInt(n).toLocaleString("es-PE");}
function fd(d){if(!d)return"—";const[y,m,day]=d.split("-");return day+"/"+m+"/"+y;}
function urg(d){if(!d)return"ok";const dt=new Date(d);const td=new Date();td.setHours(0,0,0,0);const diff=Math.floor((dt-td)/86400000);return diff<0?"urgent":diff===0?"today":"ok";}
const UL={urgent:"Seguimiento vencido",today:"Seguimiento hoy",ok:"Al día"};
const UI={urgent:"⚠",today:"⏰",ok:"✓"};
function ucp(){const a=parseFloat(document.getElementById("fa").value)||0;const p=parseFloat(document.getElementById("fcp").value)||1;document.getElementById("fcpv").textContent=fmt(ca(a,p));}
function rs(){
  const active=clients.filter(c=>c.stage<6);
  const disb=clients.filter(c=>c.stage===5);
  const ov=active.filter(c=>urg(c.followUp)==="urgent").length;
  const tot=active.reduce((a,c)=>a+(c.amount||0),0);
  document.getElementById("sg").innerHTML=[
    {lbl:"Clientes activos",val:active.length,cls:"",sub:"en pipeline"},
    {lbl:"Desembolsados",val:disb.length,cls:"b",sub:"comisión confirmada"},
    {lbl:"Seguimientos vencidos",val:ov,cls:ov>0?"r":"",sub:"requieren acción"},
    {lbl:"Monto en cartera",val:fmt(tot),cls:"sm",sub:"créditos activos"},
  ].map(s=>`<div class="stat"><div class="lbl">${s.lbl}</div><div class="val ${s.cls}">${s.val}</div><div class="sub">${s.sub}</div></div>`).join("");
  const pot=active.filter(c=>c.stage<5).reduce((a,c)=>a+ca(c.amount||0,c.commPct||1),0);
  const ern=disb.reduce((a,c)=>a+ca(c.amount||0,c.commPct||1),0);
  document.getElementById("cb").innerHTML=`<div class="bi"><div class="bl">Comisiones potenciales</div><div class="bv">${fmt(pot)}</div></div><div class="bdiv"></div><div class="bi"><div class="bl">Comisiones ganadas</div><div class="bv earned">${fmt(ern)}</div></div>`;
}
function rcl(){
  const active=clients.filter(c=>c.stage<6);
  const closed=clients.filter(c=>c.stage===6);
  let h="";
  if(!active.length) h+=`<div class="empty">📋<br>Aún no tienes clientes.<br>Agrega tu primero.</div>`;
  active.forEach(c=>{
    const u=urg(c.followUp);
    const st=ST.find(s=>s.id===c.stage);
    const cm=ca(c.amount||0,c.commPct||1);
    const isD=c.stage===5;
    h+=`<div class="card ${u}" data-id="${c.id}">
      <div class="ct"><div class="cn">${c.name}</div><span class="pill ${st.cls}">${st.label}</span></div>
      <div class="cm"><span>💰 ${fmt(c.amount)}</span><span>📅 ${fd(c.followUp)}</span></div>
      ${c.notes?`<div style="font-size:12px;color:#9AAAC0;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.notes}</div>`:""}
      <div class="cc"><span>Comisión (${c.commPct||1}%)</span><span class="cca ${isD?"eb":""}">${fmt(cm)}</span></div>
      <div class="ut ${u}">${UI[u]} ${UL[u]}</div>
    </div>`;
  });
  if(closed.length){
    h+=`<div class="closed-lbl">Caídos / Perdidos</div>`;
    closed.forEach(c=>{h+=`<div class="card closed" data-id="${c.id}"><div class="ct"><div class="cn">${c.name}</div><span class="pill p6">Perdido</span></div><div class="cm"><span>💰 ${fmt(c.amount)}</span></div></div>`;});
  }
  document.getElementById("cl").innerHTML=h;
  document.querySelectorAll(".card").forEach(card=>card.addEventListener("click",()=>od(parseInt(card.dataset.id))));
}
function ra(){rs();rcl();}
function od(id){
  const c=clients.find(x=>x.id===id);if(!c)return;
  selId=id;
  const st=ST.find(s=>s.id===c.stage);
  const u=urg(c.followUp);
  const cm=ca(c.amount||0,c.commPct||1);
  const sopts=ST.map(s=>`<button class="sopt ${c.stage===s.id?"active":""}" data-stage="${s.id}"><span class="sdot" style="background:${s.color}"></span>${s.label}${c.stage===s.id?'<span style="margin-left:auto;font-weight:700;">✓</span>':""}</button>`).join("");
  document.getElementById("dc").innerHTML=`
    <div class="handle"></div>
    <div class="dh">
      <div><div class="dn">${c.name}</div><span class="pill ${st.cls}" style="margin-top:4px;display:inline-block;">${st.label}</span></div>
      <button class="xbtn" id="xd">✕</button>
    </div>
    <div class="dr"><span class="dl">📱 Celular</span><span class="dv bl">${c.phone||"—"}</span></div>
    <div class="dr"><span class="dl">💰 Monto</span><span class="dv">${fmt(c.amount)}</span></div>
    <div class="dr"><span class="dl">📅 Seguimiento</span><span class="dv ut ${u}" style="font-size:13px;">${UI[u]} ${fd(c.followUp)}</span></div>
    <div class="dr"><span class="dl">🎯 Comisión (${c.commPct||1}%)</span><span class="dv ${c.stage===5?"gn":""}">${fmt(cm)}</span></div>
    <div class="ssub">Cambiar etapa</div>
    <div id="sg2">${sopts}</div>
    <div class="ssub" style="margin-top:14px;">Actualizar</div>
    <div class="fg"><label>Fecha de seguimiento</label><input type="date" id="dfu" value="${c.followUp||""}"/></div>
    <div class="crow fg" style="gap:10px;">
      <div style="flex:1;"><label style="display:block;font-size:11px;font-weight:600;color:#4B5C7A;margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase;">Comisión %</label>
      <input type="number" id="dcp" value="${c.commPct||1}" min="0.1" max="10" step="0.1" oninput="udc()" style="width:100%;padding:10px 12px;border:1.5px solid #D1DCF0;border-radius:8px;font-family:Barlow;font-size:14px;color:#002F87;"/></div>
      <div class="cprev" id="dcpv" style="margin-top:18px;">${fmt(cm)}</div>
    </div>
    <div class="fg"><label>Notas</label><textarea id="dno">${c.notes||""}</textarea></div>
    <button class="btnp" id="sd">Guardar cambios</button>
    <button class="delbtn" id="del">🗑 Eliminar cliente</button>
  `;
  document.getElementById("dm").classList.add("open");
  document.getElementById("xd").addEventListener("click",()=>document.getElementById("dm").classList.remove("open"));
  document.getElementById("sg2").querySelectorAll(".sopt").forEach(b=>b.addEventListener("click",()=>{
    const c2=clients.find(x=>x.id===selId);if(c2){c2.stage=parseInt(b.dataset.stage);sc(clients);od(selId);}
  }));
  document.getElementById("sd").addEventListener("click",()=>{
    const c2=clients.find(x=>x.id===selId);
    if(c2){c2.followUp=document.getElementById("dfu").value;c2.commPct=parseFloat(document.getElementById("dcp").value)||1;c2.notes=document.getElementById("dno").value.trim();sc(clients);document.getElementById("dm").classList.remove("open");ra();}
  });
  document.getElementById("del").addEventListener("click",()=>{
    if(confirm("¿Eliminar este cliente?")){clients=clients.filter(x=>x.id!==selId);sc(clients);document.getElementById("dm").classList.remove("open");ra();}
  });
}
function udc(){const c=clients.find(x=>x.id===selId);if(!c)return;const p=parseFloat(document.getElementById("dcp").value)||1;document.getElementById("dcpv").textContent=fmt(ca(c.amount||0,p));}
document.getElementById("abtn").addEventListener("click",()=>{
  ["fn","fp","fa","fno"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fcp").value="1";document.getElementById("fcpv").textContent="S/ 0";
  document.getElementById("fs").value="1";document.getElementById("ff").value="";
  document.getElementById("am").classList.add("open");
});
document.getElementById("ac").addEventListener("click",()=>document.getElementById("am").classList.remove("open"));
document.getElementById("as").addEventListener("click",()=>{
  const name=document.getElementById("fn").value.trim();if(!name){document.getElementById("fn").focus();return;}
  clients.unshift({id:Date.now(),name,phone:document.getElementById("fp").value.trim(),amount:parseFloat(document.getElementById("fa").value)||0,commPct:parseFloat(document.getElementById("fcp").value)||1,stage:parseInt(document.getElementById("fs").value),followUp:document.getElementById("ff").value,notes:document.getElementById("fno").value.trim()});
  sc(clients);document.getElementById("am").classList.remove("open");ra();
});
ra();
</script>
</body>
</html>
